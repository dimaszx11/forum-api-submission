name: Continuous Integration
on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Migrations
        run: npm run migrate up
        env:
          NODE_ENV: test
          # Database URL untuk node-pg-migrate
          DATABASE_URL: postgres://postgres:password_test@localhost:5432/forumapi_test
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password_test
          PGDATABASE: forumapi_test
          PGPORT: 5432

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          # Environment untuk aplikasi (sesuai .env lokal kamu)
          PGHOST_TEST: localhost
          PGUSER_TEST: postgres
          PGPASSWORD_TEST: password_test
          PGDATABASE_TEST: forumapi_test
          PGPORT_TEST: 5432
          # Backup jika aplikasi menggunakan DATABASE_URL
          DATABASE_URL: postgres://postgres:password_test@localhost:5432/forumapi_test
          # Mengambil nilai dari GitHub Secrets yang sudah kamu isi
          ACCESS_TOKEN_KEY: ${{ secrets.ACCESS_TOKEN_KEY }}
          REFRESH_TOKEN_KEY: ${{ secrets.REFRESH_TOKEN_KEY }}
          ACCCESS_TOKEN_AGE: 5000