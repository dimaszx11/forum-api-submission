name: Continuous Integration
on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Migrations
        # Menggunakan npx agar pasti memanggil binary node-pg-migrate yang benar
        run: npx node-pg-migrate up
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:password_test@localhost:5432/forumapi_test

      - name: Run Tests
        # Menambahkan sleep 5s untuk memastikan DB benar-benar siap setelah migrasi massal
        run: sleep 5 && npm test
        env:
          NODE_ENV: test
          PGHOST_TEST: localhost
          PGUSER_TEST: postgres
          PGPASSWORD_TEST: password_test
          PGDATABASE_TEST: forumapi_test
          PGPORT_TEST: 5432
          DATABASE_URL: postgres://postgres:password_test@localhost:5432/forumapi_test
          ACCESS_TOKEN_KEY: ${{ secrets.ACCESS_TOKEN_KEY }}
          REFRESH_TOKEN_KEY: ${{ secrets.REFRESH_TOKEN_KEY }}
          ACCCESS_TOKEN_AGE: 5000