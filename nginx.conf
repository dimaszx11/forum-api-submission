# Konfigurasi Rate Limiting
# 90 request per menit = 1.5 request per second (kita bulatkan ke 90r/m sesuai kriteria)
limit_req_zone $binary_remote_addr zone=one:10m rate=90r/m;

server {
    listen 80;
    server_name dcdg.xyz; # Ganti dengan domain/subdomain kamu nanti

    location / {
        proxy_pass http://localhost:5000; # Sesuaikan dengan PORT aplikasi kamu
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # KRITERIA: Resource yang dibatasi adalah /threads dan path di dalamnya
    location /threads {
        limit_req zone=one;
        
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
